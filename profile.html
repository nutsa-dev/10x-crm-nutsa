<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10X CRM - Profile Settings</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">

    <script src="js/guard.js" defer></script>
    <script src="js/theme.js" defer></script>
</head>
<body class="app-body">

    <div class="toast" id="toast"></div>

    <header class="app-header">
        <div class="header-container">
            <div class="brand">
                <span class="brand-logo">10X</span>
                <span class="brand-title">CRM</span>
            </div>

            <nav class="nav-menu">
                <a href="dashboard.html" class="nav-link">Dashboard</a>
                <a href="clients.html" class="nav-link">Clients</a>
                <a href="profile.html" class="nav-link active">Profile</a>
            </nav>

            <div class="header-actions">
                <div class="live-clock" id="liveClock">00:00:00 AM</div>
                <button type="button" class="btn-theme" id="themeToggleBtn" onclick="toggleTheme()" aria-label="Toggle Theme">🌙</button>
                <button type="button" class="btn-logout" onclick="logout()">Log Out</button>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            
            <div class="page-header-bar">
                <div>
                    <h1>Account Profile</h1>
                </div>
            </div>            <div class="profile-container-new">
                
                <!-- TOP ROW: User Card -->
                <div class="profile-card card profile-header-card">
                    <div class="profile-header-info profile-header-horizontal">
                        <div class="avatar-circle" id="profileInitials">NB</div>
                        <div class="profile-user-details profile-details-horizontal">
                            <div class="name-email-horizontal">
                                <h2 id="profileFullName">User Name</h2>
                            </div>
                            <div>
                                <p id="profileMeta" class="profile-meta"></p>
                                <p id="profileEmail" class="user-email-text"></p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- MIDDLE ROW: 3 Columns -->
                <div class="profile-3col-grid">
                    
                    <div class="profile-card card text-center-header">
                        <h3>Edit Profile</h3>
                        <form id="editProfileForm" novalidate>
                            <div class="form-group">
                                <label>Full Name</label>
                                <input type="text" id="editFullName" class="form-input-neo">
                                <div class="error-text" id="editFullNameError"></div>
                            </div>
                            <div class="form-group">
                                <label>Company</label>
                                <input type="text" id="editCompany" class="form-input-neo">
                                <div class="error-text"></div>
                            </div>
                            <button type="submit" class="btn-submit-glass">Save Changes</button>
                        </form>
                    </div>

                    <div class="profile-card card text-center-header">
                        <h3>Change Email</h3>
                        <form id="changeEmailForm" novalidate>
                            <div class="form-group">
                                <label>Current Email</label>
                                <input type="email" id="currentEmail" class="form-input-neo">
                                <div class="error-text" id="currentEmailError"></div>
                            </div>
                            <div class="form-group">
                                <label>New Email</label>
                                <input type="email" id="newEmail" class="form-input-neo">
                                <div class="error-text" id="newEmailError"></div>
                            </div>
                            <button type="submit" class="btn-submit-glass">Update Email</button>
                        </form>
                    </div>

                    <div class="profile-card card text-center-header">
                        <h3>Change Password</h3>
                        <form id="changePasswordForm" novalidate>
                            <div class="form-group">
                                <label>Current Password</label>
                                <div class="password-wrapper">
                                    <input type="password" id="currentPassword" class="form-input-neo" autocomplete="current-password">
                                    <button type="button" class="btn-toggle-password" onclick="togglePasswordVisibility('currentPassword', this)" title="Show/Hide Password" aria-label="Toggle password visibility">
                                        <svg class="eye-icon eye-open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                            <circle cx="12" cy="12" r="3"></circle>
                                        </svg>
                                        <svg class="eye-icon eye-closed" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                            <line x1="1" y1="1" x2="23" y2="23"></line>
                                        </svg>
                                    </button>
                                </div>
                                <div class="error-text" id="currentPasswordError"></div>
                            </div>
                            <div class="form-group">
                                <label>New Password</label>
                                <div class="password-wrapper">
                                    <input type="password" id="newPassword" class="form-input-neo" autocomplete="new-password">
                                    <button type="button" class="btn-toggle-password" onclick="togglePasswordVisibility('newPassword', this)" title="Show/Hide Password" aria-label="Toggle password visibility">
                                        <svg class="eye-icon eye-open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                            <circle cx="12" cy="12" r="3"></circle>
                                        </svg>
                                        <svg class="eye-icon eye-closed" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                            <line x1="1" y1="1" x2="23" y2="23"></line>
                                        </svg>
                                    </button>
                                </div>
                                <div class="error-text" id="newPasswordError"></div>
                            </div>
                            <div class="form-group">
                                <label>Confirm New Password</label>
                                <div class="password-wrapper">
                                    <input type="password" id="confirmNewPassword" class="form-input-neo" autocomplete="new-password">
                                    <button type="button" class="btn-toggle-password" onclick="togglePasswordVisibility('confirmNewPassword', this)" title="Show/Hide Password" aria-label="Toggle password visibility">
                                        <svg class="eye-icon eye-open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                            <circle cx="12" cy="12" r="3"></circle>
                                        </svg>
                                        <svg class="eye-icon eye-closed" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                            <line x1="1" y1="1" x2="23" y2="23"></line>
                                        </svg>
                                    </button>
                                </div>
                                <div class="error-text" id="confirmNewPasswordError"></div>
                            </div>
                            <button type="submit" class="btn-submit-glass">Change Password</button>
                        </form>
                    </div>
                </div>

                <!-- BOTTOM ROW: Reset Data -->
                <div class="profile-card card danger-card profile-reset-card">
                    <h3 class="text-center-header">Data Management</h3>
                    <p class="card-subtitle text-center">Reset your local CRM client database to the initial API state.</p>
                    <button type="button" class="btn-delete-client btn-reset-data" onclick="resetCRMData()">Reset CRM Data</button>
                </div>
            </div>

        </div>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
