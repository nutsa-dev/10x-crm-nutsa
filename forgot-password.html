<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10X CRM - Reset Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    
    <script src="js/guard.js" defer></script>
    <script src="js/theme.js" defer></script>
</head>
<body class="auth-body">

    <div class="fixed-theme-wrapper">
        <button type="button" class="btn-theme-fixed" id="themeToggleBtn" onclick="toggleTheme()" aria-label="Toggle Theme">🌙</button>
    </div>

    <div class="toast" id="toast"></div>

    <div class="card">
        <h2>Reset Password</h2>
        <p class="card-subtitle">Enter your registered email to set a new password</p>

        <div class="global-error" id="globalError"></div>

        <form id="resetPasswordForm" novalidate>
            <div class="form-group" id="emailStepGroup">
                <label>Email Address</label>
                <input type="email" id="resetEmail" class="form-input-neo" placeholder="name@company.com">
                <div class="error-text" id="resetEmailError"></div>
            </div>

            <div id="newPasswordStepGroup" style="display: none;">
                <div class="form-group">
                    <label>New Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="resetNewPassword" class="form-input-neo" placeholder="••••••••">
                        <button type="button" class="btn-toggle-password" onclick="togglePasswordVisibility('resetNewPassword', this)" title="Show/Hide Password" aria-label="Toggle password visibility">
                            <svg class="eye-icon eye-open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="eye-icon eye-closed" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                    <div class="password-strength-container" id="passwordStrengthContainer" style="display: none;">
                        <div class="strength-bar-wrapper">
                            <div class="strength-bar" id="strengthBar"></div>
                        </div>
                        <div class="strength-text" id="strengthText">Weak</div>
                    </div>
                    <div class="error-text" id="resetNewPasswordError"></div>
                </div>
                <div class="form-group">
                    <label>Confirm New Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="resetConfirmPassword" class="form-input-neo" placeholder="••••••••">
                        <button type="button" class="btn-toggle-password" onclick="togglePasswordVisibility('resetConfirmPassword', this)" title="Show/Hide Password" aria-label="Toggle password visibility">
                            <svg class="eye-icon eye-open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="eye-icon eye-closed" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                    <div class="error-text" id="resetConfirmPasswordError"></div>
                </div>
            </div>

            <button type="submit" class="btn-submit-glass" id="resetSubmitBtn">Verify Email</button>
        </form>

        <div class="link">
            Remembered your password? <a href="index.html">Log in</a>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        document.getElementById('resetPasswordForm').addEventListener('submit', handlePasswordReset);
    </script>
</body>
</html>
