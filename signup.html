<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10X CRM - Sign Up</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    
    <script src="js/guard.js" defer></script>
    <script src="js/theme.js" defer></script>
</head>
<body class="auth-body">

    <div class="fixed-theme-wrapper">
        <button type="button" class="btn-theme-fixed" id="themeToggleBtn" onclick="toggleTheme()" aria-label="Toggle Theme">🌙</button>
    </div>

    <div class="toast" id="toast"></div>

    <div class="card">
        <h2>Create Account</h2>
        <p class="card-subtitle">Get started with your 10X CRM workspace</p>

        <form id="signupForm" novalidate>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="fullName" class="form-input-neo" placeholder="John Doe">
                <div class="error-text" id="fullNameError"></div>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" class="form-input-neo" placeholder="name@company.com">
                <div class="error-text" id="emailError"></div>
            </div>
            <div class="form-group">
                <label>Company (optional)</label>
                <input type="text" id="company" class="form-input-neo" placeholder="Acme Inc.">
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" class="form-input-neo" placeholder="••••••••">
                    <button type="button" class="btn-toggle-password" onclick="togglePasswordVisibility('password', this)" title="Show/Hide Password" aria-label="Toggle password visibility">
                        <svg class="eye-icon eye-open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg class="eye-icon eye-closed" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>
                <div class="password-strength-container" id="passwordStrengthContainer" style="display: none;">
                    <div class="strength-bar-wrapper">
                        <div class="strength-bar" id="strengthBar"></div>
                    </div>
                    <div class="strength-text" id="strengthText">Weak</div>
                </div>
                <div class="error-text" id="passwordError"></div>
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <div class="password-wrapper">
                    <input type="password" id="confirmPassword" class="form-input-neo" placeholder="••••••••">
                    <button type="button" class="btn-toggle-password" onclick="togglePasswordVisibility('confirmPassword', this)" title="Show/Hide Password" aria-label="Toggle password visibility">
                        <svg class="eye-icon eye-open" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                        <svg class="eye-icon eye-closed" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </button>
                </div>
                <div class="error-text" id="confirmPasswordError"></div>
            </div>
            <button type="submit" class="btn-submit-glass">Create Account</button>
        </form>

        <div class="link">
            Already have an account? <a href="index.html">Log in</a>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        document.getElementById('signupForm').addEventListener('submit', handleSignUp);
    </script>
</body>
</html>
